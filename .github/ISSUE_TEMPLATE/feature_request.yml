name: Feature request
description: A feature revmesh should recognise, or an improvement to the plugin.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The part or workflow, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should revmesh do?
      description: For a new recogniser, the SolidCraft features you would expect it to produce.
  - type: textarea
    id: example
    attributes:
      label: Example STL
      description: Optional, but very helpful.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
