name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Pull requests and commits made with the workflow's own GITHUB_TOKEN start no workflows, so the
# release PR would never get its CI checks and could not be merged once they are required.
# release-please therefore uses its own token, the repository secret RELEASE_PLEASE_TOKEN: a
# fine-grained personal access token for this repository with "Contents" and "Pull requests"
# read and write (see docs/releasing.md).

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - name: Check for the release token
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The repository secret RELEASE_PLEASE_TOKEN is missing; see docs/releasing.md."
            exit 1
          fi
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps the versions in Cargo.toml and plugin.json; Cargo.lock has to follow,
  # or every `--locked` build of the release PR fails.
  sync-lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          # Pushing with this token, not GITHUB_TOKEN, makes the commit start CI on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - run: cargo update --workspace
      - name: Commit Cargo.lock
        run: |
          if git diff --quiet Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync Cargo.lock with the release version"
          git push

  publish-plugin:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask dist
      - name: Attach the plugin to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/dist
          sha256sum *.zip > SHA256SUMS.txt
          gh release upload "${{ needs.release-please.outputs.tag_name }}" *.zip SHA256SUMS.txt --clobber
