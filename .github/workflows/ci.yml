name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The SolidCraft release whose plugin interface and test runner the plugin is checked against.
  SOLIDCRAFT_VERSION: 0.51.1
  # release-please bumps the version in Cargo.toml and its sync-lockfile job commits the
  # matching Cargo.lock in a follow-up push, so on release branches the first CI run must
  # be allowed to update the lockfile instead of asserting it is unchanged.
  CARGO_LOCKED: ${{ !startsWith(github.head_ref, 'release-please--') && '--locked' || '' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: clippy (native, all targets)
        run: cargo clippy --workspace --all-targets ${{ env.CARGO_LOCKED }} -- -D warnings
      - name: clippy (wasm32, plugin)
        run: cargo clippy -p revmesh-plugin -p revmesh-core --target wasm32-unknown-unknown ${{ env.CARGO_LOCKED }} -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace ${{ env.CARGO_LOCKED }}

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.msrv.outputs.version }} check -p revmesh-core ${{ env.CARGO_LOCKED }}
      - run: cargo +${{ steps.msrv.outputs.version }} check -p revmesh-plugin --target wasm32-unknown-unknown ${{ env.CARGO_LOCKED }}

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p revmesh-core --no-deps ${{ env.CARGO_LOCKED }}

  deny:
    name: cargo-deny (licences, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  component:
    name: wasm component and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask dist
      - name: Component size
        run: |
          size=$(stat -c %s plugin/revmesh/revmesh.wasm)
          echo "revmesh.wasm: $size bytes" >> "$GITHUB_STEP_SUMMARY"
          # SolidCraft refuses importer components above 64 MiB.
          test "$size" -lt 67108864
      - uses: actions/upload-artifact@v7
        with:
          name: revmesh-plugin
          path: target/dist/*.zip
          if-no-files-found: error

  plugin-test:
    name: SolidCraft plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Download solidcraft-cli ${{ env.SOLIDCRAFT_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$SOLIDCRAFT_VERSION" -R tangency-labs/solidcraft \
            -p "solidcraft-$SOLIDCRAFT_VERSION-linux-x86_64.tar.gz" -O "$RUNNER_TEMP/solidcraft.tar.gz"
          tar xzf "$RUNNER_TEMP/solidcraft.tar.gz" -C "$RUNNER_TEMP"
          echo "SOLIDCRAFT_CLI=$RUNNER_TEMP/solidcraft-$SOLIDCRAFT_VERSION-linux-x86_64/bin/solidcraft-cli" >> "$GITHUB_ENV"
      - run: cargo xtask plugin-test
      - run: cargo xtask check

  example-cli:
    name: Headless CLI example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Download solidcraft-cli ${{ env.SOLIDCRAFT_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$SOLIDCRAFT_VERSION" -R tangency-labs/solidcraft \
            -p "solidcraft-$SOLIDCRAFT_VERSION-linux-x86_64.tar.gz" -O "$RUNNER_TEMP/solidcraft.tar.gz"
          tar xzf "$RUNNER_TEMP/solidcraft.tar.gz" -C "$RUNNER_TEMP"
          echo "SOLIDCRAFT_CLI=$RUNNER_TEMP/solidcraft-$SOLIDCRAFT_VERSION-linux-x86_64/bin/solidcraft-cli" >> "$GITHUB_ENV"
      - run: cargo xtask dist
      - run: scripts/example-cli.sh

  coverage:
    name: "coverage (gate: >= 80% lines, whole workspace)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Whole workspace, no source excluded; the job fails below 80% line coverage.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 80
      - run: cargo llvm-cov report --workspace --summary-only >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
      # The pull request's coverage comment: this job has only a read token (and a fork's PR no
      # secrets at all), so it leaves the Markdown and the PR number as an artifact, and the
      # `coverage-comment` workflow posts them with a write token once CI has finished. Also
      # written when the gate fails, so the comment shows why.
      - name: Coverage comment body
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p coverage-comment
          cargo llvm-cov report --workspace --json --summary-only --output-path coverage.json
          scripts/coverage-markdown.sh coverage.json "$HEAD_SHA" > coverage-comment/body.md
          echo "$PR_NUMBER" > coverage-comment/pr-number
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          name: coverage-comment
          path: coverage-comment/
          retention-days: 3

  # One required check for branch protection: green only when every gate above is green.
  ci-ok:
    name: CI ok
    if: always()
    needs: [fmt, clippy, test, msrv, docs, deny, component, plugin-test, example-cli, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: A gate failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All gates passed"
