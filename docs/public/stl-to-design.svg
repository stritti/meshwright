<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">STL to editable SolidCraft design</title>
  <desc id="desc">An STL triangle mesh fades into a parametric part: Sketch1, Extrude1, Hole1 and Fillet1 in the timeline, with editable parameters.</desc>

  <rect x="8" y="8" width="504" height="344" rx="14" fill="#0d1b2e" stroke="#24406b"/>
  <ellipse cx="185" cy="240" rx="120" ry="9" fill="#000000" opacity="0.35"/>

  <!-- STL: the dead triangle mesh -->
  <g stroke="#6f9fe8" stroke-width="1" fill="#3e7bd6" fill-opacity="0.08" stroke-linejoin="round" stroke-linecap="round">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.14;0.26;0.96;1" values="1;1;0;0;1"/>
    <g fill="none" stroke-opacity="0.4">
      <rect x="86" y="64" width="220" height="140"/>
      <path d="M196 64V204M86 134H306"/>
    </g>
    <path d="M70 80L86 64M290 80L306 64M290 220L306 204M70 220L86 204" fill="none"/>
    <rect x="70" y="80" width="220" height="140"/>
    <path d="M180 80V220M70 150H290M70 80L180 150M290 80L180 150M70 220L180 150M290 220L180 150" fill="none"/>
    <polygon points="70,80 290,80 306,64 86,64"/>
    <path d="M70 80L306 64M180 80L196 64" fill="none"/>
    <polygon points="290,80 290,220 306,204 306,64"/>
    <path d="M290 80L306 204M290 150L306 134" fill="none"/>
    <polygon points="211.4,163 193,181.4 167,181.4 148.6,163 148.6,137 167,118.6 193,118.6 211.4,137" fill="#0d1b2e" fill-opacity="1"/>
    <g stroke="none" fill="#3e7bd6">
      <polygon points="70,80 180,80 180,150" opacity="0.18"/>
      <polygon points="180,150 290,150 290,220" opacity="0.28"/>
      <polygon points="70,150 180,150 70,220" opacity="0.12"/>
    </g>
  </g>

  <!-- SolidCraft: the editable design -->
  <g stroke="#d7e6fb" stroke-width="1.5" stroke-linejoin="round">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.14;0.26;0.96;1" values="0;0;1;1;0"/>
    <polygon points="70,80 290,80 306,64 86,64" fill="#3e7bd6"/>
    <polygon points="290,80 290,220 306,204 306,64" fill="#24497f"/>
    <path d="M84 80H276Q290 80 290 94V206Q290 220 276 220H84Q70 220 70 206V94Q70 80 84 80Z" fill="#2b5ea8"/>
    <circle cx="180" cy="150" r="34" fill="#0d1b2e" stroke-width="2"/>
  </g>

  <!-- feature timeline and parameter panel -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <g>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.26;0.32;0.94;1" values="0;0;1;1;0"/>
      <rect x="322" y="56" width="190" height="262" rx="10" fill="#0a1526" stroke="#24406b"/>
      <text x="338" y="80" font-size="10" letter-spacing="1.5" fill="#8fb4e8">FEATURE TIMELINE</text>
      <path d="M338 196H496" stroke="#24406b" stroke-width="1"/>
      <text x="338" y="218" font-size="10" letter-spacing="1.5" fill="#8fb4e8">PARAMETERS</text>
    </g>

    <g stroke="#8fb4e8" stroke-width="1" stroke-dasharray="3 3" fill="none">
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.30;0.35;0.94;1" values="0;0;1;1;0"/>
        <path d="M322 100L287 93"/><circle cx="287" cy="93" r="2" fill="#8fb4e8" stroke="none"/>
      </g>
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.38;0.43;0.94;1" values="0;0;1;1;0"/>
        <path d="M322 126L299 140"/><circle cx="299" cy="140" r="2" fill="#8fb4e8" stroke="none"/>
      </g>
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.46;0.51;0.94;1" values="0;0;1;1;0"/>
        <path d="M322 152L215 143"/><circle cx="213" cy="142" r="2" fill="#8fb4e8" stroke="none"/>
      </g>
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.54;0.59;0.94;1" values="0;0;1;1;0"/>
        <path d="M322 178L286 216"/><circle cx="286" cy="216" r="2" fill="#8fb4e8" stroke="none"/>
      </g>
    </g>

    <g font-size="12.5" fill="#e8f0fc">
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.30;0.35;0.94;1" values="0;0;1;1;0"/>
        <rect x="334" y="94" width="12" height="12" fill="none" stroke="#7db3f0" stroke-width="1.5"/>
        <text x="356" y="104">Sketch1</text>
      </g>
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.38;0.43;0.94;1" values="0;0;1;1;0"/>
        <rect x="334" y="124" width="12" height="8" fill="none" stroke="#7db3f0" stroke-width="1.5"/>
        <path d="M340 124V116M337 119L340 116L343 119" fill="none" stroke="#7db3f0" stroke-width="1.5"/>
        <text x="356" y="130">Extrude1</text>
      </g>
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.46;0.51;0.94;1" values="0;0;1;1;0"/>
        <circle cx="340" cy="150" r="6" fill="none" stroke="#7db3f0" stroke-width="1.5"/>
        <text x="356" y="156">Hole1</text>
      </g>
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.54;0.59;0.94;1" values="0;0;1;1;0"/>
        <path d="M334 178Q334 166 346 166" fill="none" stroke="#7db3f0" stroke-width="1.5"/>
        <text x="356" y="182">Fillet1</text>
      </g>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.62;0.67;0.94;1" values="0;0;1;1;0"/>
        <text x="338" y="238" fill="#cfe3ff">base_x</text><text x="496" y="238" text-anchor="end" fill="#8fb4e8">95</text>
      </g>
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.68;0.73;0.94;1" values="0;0;1;1;0"/>
        <text x="338" y="256" fill="#cfe3ff">base_y</text><text x="496" y="256" text-anchor="end" fill="#8fb4e8">66</text>
      </g>
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.74;0.79;0.94;1" values="0;0;1;1;0"/>
        <text x="338" y="274" fill="#cfe3ff">base_t</text><text x="496" y="274" text-anchor="end" fill="#8fb4e8">3</text>
      </g>
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.80;0.85;0.94;1" values="0;0;1;1;0"/>
        <text x="338" y="292" fill="#cfe3ff">hole_1_d</text><text x="496" y="292" text-anchor="end" fill="#8fb4e8">6</text>
      </g>
      <g>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.86;0.91;0.94;1" values="0;0;1;1;0"/>
        <text x="338" y="310" fill="#cfe3ff">fillet_r</text><text x="496" y="310" text-anchor="end" fill="#8fb4e8">4</text>
      </g>
    </g>
  </g>

  <!-- captions -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" text-anchor="middle">
    <text x="260" y="344" fill="#9db8dd">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.14;0.26;0.96;1" values="1;1;0;0;1"/>
      STL in: a dead mesh of flat triangles
    </text>
    <text x="260" y="344" fill="#e8f0fc">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.14;0.26;0.96;1" values="0;0;1;1;0"/>
      revmesh out: an editable, parametric design
    </text>
  </g>
</svg>
